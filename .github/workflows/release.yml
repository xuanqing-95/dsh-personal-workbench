name: Release
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  package:
    outputs:
      stable: ${{ steps.version.outputs.stable }}
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run release:verify
      - name: Check release version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" != *-* ]]; then echo "stable=true" >> "$GITHUB_OUTPUT"; fi
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            previous=$(git show "$BEFORE:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
            if [[ "$version" != "$previous" ]]; then
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Package and publish version
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          archive=$(npm pack --silent --ignore-scripts --pack-destination dist)
          options=(--latest)
          if [[ "$TAG" == *-* ]]; then
            options=(--prerelease --latest=false)
          else
            cp "dist/$archive" "dist/$(node -p 'require("./package.json").name').tgz"
          fi
          if [[ "$TAG" != *-* ]]; then
            # Keep the original shared download link serving the original package.
            gh release download v0.8.3 --pattern dsh-personal-workbench.tgz --dir dist
            gh release download v0.8.4 --pattern dsh-xuanqing-personal-workbench.tgz --dir dist
            (cd dist && echo '3eb491854f87975e6eb3556b40653b1cbbcf33413c1a974b8784336a9064e3cc  dsh-personal-workbench.tgz' | sha256sum --check --strict)
          fi
          (cd dist && sha256sum *.tgz > SHA256SUMS)
          if ! git show-ref --quiet --verify "refs/tags/$TAG"; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          test "$(git rev-parse "${TAG}^{commit}")" = "$GITHUB_SHA"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            title="$(node -p 'require("./locale/zh.json").meta.title') $TAG"
            gh release create "$TAG" dist/*.tgz dist/SHA256SUMS --verify-tag --title "$title" --notes-file RELEASE-NOTES.md "${options[@]}"
          fi
      - name: Build installation page for the published plugin
        if: steps.version.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          gh release view "$tag" --json isDraft --jq '.isDraft' | grep -Fx false
          node scripts/release.mjs site "$(git rev-parse "${tag}^{commit}")"
      - uses: actions/configure-pages@v5
        if: steps.version.outputs.stable == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.version.outputs.stable == 'true'
        with:
          path: dist/site
  pages:
    needs: package
    if: needs.package.outputs.stable == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish installation page and index
        id: deployment
        uses: actions/deploy-pages@v4

  npm:
    needs: package
    if: needs.package.outputs.stable == 'true' && needs.package.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish the verified GitHub Release archive to npm
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.package.outputs.tag }}
        run: |
          name=dsh-personal-workbench-xuanqing
          archive="$name-${TAG#v}.tgz"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --pattern SHA256SUMS
          awk -v file="$archive" '$2 == file' SHA256SUMS | sha256sum --check --strict
          expected="sha512-$(openssl dgst -sha512 -binary "$archive" | openssl base64 -A)"
          metadata="https://registry.npmjs.org/$name/${TAG#v}"
          status=$(curl --silent --show-error --retry 3 --output metadata.json --write-out '%{http_code}' "$metadata")
          case "$status" in
            200) test "$(jq -r '.dist.integrity' metadata.json)" = "$expected" ;;
            404) npm publish "./$archive" --ignore-scripts --access public --registry=https://registry.npmjs.org/ ;;
            *) echo "Registry lookup returned HTTP $status"; exit 1 ;;
          esac
          # npm may acknowledge an upload before the package is available to users.
          for attempt in {1..40}; do
            if curl --fail --silent --show-error --max-time 15 "$metadata" -o metadata.json; then
              test "$(jq -r '.dist.integrity' metadata.json)" = "$expected"
              exit 0
            fi
            sleep 30
          done
          echo "The release is still unavailable on npm."
          exit 1
